# Typecheck, lint, test and build on every push and pull request.
#
# There was no CI at all: `npm run build` on somebody's laptop was the only
# thing standing between a type error and production. All four steps run even
# when an earlier one fails, so one push tells you everything that is wrong
# rather than the first thing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the run still going for the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `ci` rather than `install`: it installs exactly the lockfile and fails
      # if package.json and package-lock.json have drifted apart, which is a
      # thing worth failing on.
      - name: Install
        run: npm ci

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Test
        id: test
        if: ${{ !cancelled() }}
        run: npm test

      # The build needs the two public Supabase env vars to prerender. They
      # are public by definition — the browser receives both — so they belong
      # in repository VARIABLES, not secrets. The service-role key is never
      # needed here and must never be added.
      #
      # Skipped rather than failed when they are not configured, so a fresh
      # clone gets a green typecheck/lint/test run instead of a permanently red
      # tick nobody trusts. Add the variables and this step starts running on
      # its own — see the notice step below for where.
      - name: Build
        if: ${{ !cancelled() && vars.NEXT_PUBLIC_SUPABASE_URL != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Build skipped — Supabase variables not set
        if: ${{ !cancelled() && vars.NEXT_PUBLIC_SUPABASE_URL == '' }}
        run: |
          echo "::warning title=Build step skipped::Set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY under Settings -> Secrets and variables -> Actions -> Variables to enable the build check. Both are public values (the browser receives them). Do NOT add SUPABASE_SERVICE_ROLE_KEY."
