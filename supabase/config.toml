# Supabase CLI configuration.
# `project_id` is only a local label; linking to the hosted project is done with
# `npx supabase link --project-ref <ref>` (see migrations/README.md).
project_id = "gidiammini"

[db]
# Matches the hosted project (confirmed via `supabase projects list`:
# gidiammini runs postgres_engine 17), so a local `supabase start` or
# `db reset` behaves the same way as production.
major_version = 17
